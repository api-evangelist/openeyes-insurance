name: OpenEyes Insurance
description: OpenEyes Insurance (OpenEyes Insurance Agency, Inc.) is an Austin, Texas-based insurtech
  startup, with an additional New York office, that provides commercial auto insurance for truck and bus
  fleet operators bundled with proprietary risk-prevention technology. Its offering pairs fleet coverage
  with real-time driver monitoring, AI dashcams, safety analytics, customized driver training, and 24/7
  claims management, serving both insurance agents (For Agents) and fleet operators directly (For Fleets).
  Founded by Yoav Oron (CEO), Dr. Omry Sendik (CTO), and Dan Charash (Chairman), OpenEyes emerged from
  stealth in February 2023 with a $23M Series A led by Insight Partners with Pitango First. The company
  operates a customer-facing fleet dashboard but does not publish a public developer API, portal, or
  documentation surface.
